<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify - Panel Administrativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 600;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: white;
            color: #667eea;
        }
        .btn-primary:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-disabled {
            background: #6c757d;
            color: white;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
        }
        .content {
            padding: 2rem;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .filter-form {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        .filter-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .filter-actions {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #333;
        }
        .empty-state p {
            font-size: 1.1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th {
            background: #f8f9fa;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #c3e6cb;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .pagination-info {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Eventify - Panel Administrativo</h1>
            <div class="nav-links">
                <a href="/admin/events" class="nav-link" style="background: rgba(255,255,255,0.2);">Eventos</a>
                <a href="/admin/venues" class="nav-link">Lugares</a>
            </div>
            <a href="/admin/events/new" class="btn btn-primary">+ Nuevo Evento</a>
        </div>
        <div class="content">
            <div th:if="${successMessage}" class="success-message">
                <span th:text="${successMessage}"></span>
            </div>
            
            <div class="filter-section">
                <form th:action="@{/admin/events}" method="get" class="filter-form">
                    <div class="filter-group">
                        <label for="city">Ciudad</label>
                        <input 
                            type="text" 
                            id="city" 
                            name="city" 
                            th:value="${city}"
                            placeholder="Buscar por ciudad..."
                        />
                    </div>
                    <div class="filter-group">
                        <label for="category">Categoría</label>
                        <input 
                            type="text" 
                            id="category" 
                            name="category" 
                            th:value="${category}"
                            placeholder="Buscar por categoría..."
                        />
                    </div>
                    <div class="filter-actions">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <a th:href="@{/admin/events}" class="btn btn-danger">Limpiar</a>
                    </div>
                </form>
            </div>
            
            <div th:if="${summaries == null or #lists.isEmpty(summaries.content)}" class="empty-state">
                <h2>📭 Catálogo Vacío</h2>
                <p>No se encontraron eventos con los filtros actuales.</p>
                <p style="margin-top: 1rem;">¡Intenta con otros filtros o crea un nuevo evento!</p>
            </div>
            
            <div th:if="${summaries != null and not #lists.isEmpty(summaries.content)}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Lugar</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="summary : ${summaries.content}">
                            <td th:text="${summary.id}"></td>
                            <td th:text="${summary.nombre}"></td>
                            <td th:text="${#temporals.format(summary.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${summary.venueName}"></td>
                            <td th:text="${summary.city}"></td>
                            <td>
                                <form th:action="@{/admin/events/{id}/delete(id=${summary.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-danger" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Desactivar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="pagination-info">
                    <span th:text="'Página ' + (${page} + 1)"></span>
                </div>
                
                <div class="pagination">
                    <a th:if="${summaries.hasPrevious()}"
                       th:href="@{/admin/events(page=${page - 1}, size=${size}, city=${city}, category=${category})}"
                       class="btn btn-primary">← Anterior</a>
                    <a th:if="${!summaries.hasPrevious()}"
                       class="btn btn-disabled">← Anterior</a>
                    <a th:if="${summaries.hasNext()}"
                       th:href="@{/admin/events(page=${page + 1}, size=${size}, city=${city}, category=${category})}"
                       class="btn btn-primary">Siguiente →</a>
                    <a th:if="${!summaries.hasNext()}"
                       class="btn btn-disabled">Siguiente →</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
