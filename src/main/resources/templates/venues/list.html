<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify - Lugares</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 600;
        }
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: white;
            color: #667eea;
        }
        .btn-primary:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        .content {
            padding: 2rem;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #333;
        }
        .empty-state p {
            font-size: 1.1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th {
            background: #f8f9fa;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #c3e6cb;
        }
        .capacity-badge {
            background: #667eea;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gestión de Lugares</h1>
            <div class="nav-links">
                <a href="/admin/events" class="nav-link">Eventos</a>
                <a href="/admin/venues" class="nav-link" style="background: rgba(255,255,255,0.2);">Lugares</a>
            </div>
            <a href="/admin/venues/new" class="btn btn-primary">+ Nuevo Lugar</a>
        </div>
        <div class="content">
            <div th:if="${successMessage}" class="success-message">
                <span th:text="${successMessage}"></span>
            </div>
            
            <div th:if="${venues == null or #lists.isEmpty(venues)}" class="empty-state">
                <h2>📭 Sin Lugares Registrados</h2>
                <p>Actualmente no hay lugares registrados en el sistema.</p>
                <p style="margin-top: 1rem;">¡Registra tu primer lugar para comenzar!</p>
            </div>
            
            <div th:if="${venues != null and not #lists.isEmpty(venues)}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Capacidad</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="venue : ${venues}">
                            <td th:text="${venue.id}"></td>
                            <td th:text="${venue.nombre}"></td>
                            <td th:text="${venue.direction}"></td>
                            <td><span class="capacity-badge" th:text="${venue.capacidad + ' personas'}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
